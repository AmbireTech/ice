name: Concept page

# Publishes the concept page (docs/ambire-signer.html, proto 0) to GitHub Pages as
# the site's index, with only the files it loads (brand/, enclosure/), and the proto 1
# page (docs/v2/: its own index.html, brand/, enclosure/) at /v2/, which the index does
# not link. The rest of docs/ (design notes, research) stays out of the public site.
# Needs Settings -> Pages -> Source: GitHub Actions.
# Live at https://ambiretech.github.io/secure-signer/

on:
  push:
    branches: [main]
    paths:
      - docs/ambire-signer.html
      - docs/brand/**
      - docs/enclosure/**
      - docs/v2/**
      - .github/workflows/concept-page.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the page and its files
        run: |
          mkdir -p _site
          cp docs/ambire-signer.html _site/index.html
          cp -R docs/brand docs/enclosure _site/
          mkdir -p _site/v2
          cp docs/v2/index.html _site/v2/index.html
          cp -R docs/v2/brand docs/v2/enclosure _site/v2/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
