; Reference firmware for an Ai-Thinker ESP32-CAM: Espressif's own OV2640 driver
; (espressif/esp32-camera, pinned in src/idf_component.yml) behind a Wi-Fi page.
; README.md says how to build, flash and use it.

[env:esp32cam]
; pioarduino's platform 55.03.312: ESP-IDF 5.5.5 (esp32-camera b3f7fe8 needs
; IDF >= 5.1). Not the Arduino framework: it bundles its own prebuilt
; esp32-camera, which cannot be pinned to a commit.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32cam
framework = espidf
monitor_speed = 115200
upload_speed = 460800
board_build.embed_txtfiles = src/page.html
; 1.5 MB app (IDF's single-app-large table): the image is ~1 MB
board_build.partitions = partitions_singleapp_large.csv
