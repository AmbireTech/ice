; QR scanner for an Ai-Thinker ESP32-CAM with an OV2640: the device's own QR
; decoder (firmware/trezor-firmware/core/embed/io/camera/qr) on the ESP32,
; results as text on the USB-serial port. README.md says how to use it.

[env:esp32cam]
; pioarduino's platform 55.03.312: ESP-IDF 5.5.5 (esp32-camera b3f7fe8 needs IDF >= 5.1)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32cam
framework = espidf
monitor_speed = 115200
; RTS/DTR drive EN and IO0 on the ESP32-CAM-MB: released, or the monitor holds it in reset
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
board_build.partitions = partitions_singleapp_large.csv
