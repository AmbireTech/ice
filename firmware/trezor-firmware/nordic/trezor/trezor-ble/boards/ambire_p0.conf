# Ambire Ice proto 0 radio (E73-2G4M08S1C, nRF52840), auto-merged by Zephyr
# for this board only.

# All services over one framed 2-wire UART (src/trz_comm/uart_link.c) instead
# of SPI plus the GPIO handshake and signal lines, which this board lacks.
CONFIG_TREZOR_UART_LINK=y
CONFIG_SPI=n

# Device Information Service identity (NCS 3.3 symbol names).
CONFIG_BT_DIS_MANUF_NAME_STR="Ambire"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Ambire Ice"
