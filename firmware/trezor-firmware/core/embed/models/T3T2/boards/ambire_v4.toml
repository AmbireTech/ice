# Ambire signer, v4: proto 0's board with the airgap sense on PB15 (ambire_v4.h).
header = "T3T2/boards/ambire_v4.h"
emulator_header = "T3T2/boards/unix.h"

# The ST7789 over 4-wire SPI. The panel init is Trezor's DEM240320B1 sequence
# (same controller and resolution) until it is tuned on the Newhaven panel.
[display]
driver = "io/display_spi"
panel = "io/display_panel_dem240320b1"

# The Ambire flame in place of the Trezor logo (welcome screen, bootloader too)
[ambire_branding]

# A raycaster maze behind 7 quick taps on the home screen (firmware only)
[ambire_game]

# The airgap switch's position (AIRGAP_SENSE), for the UI: the swipe up on
# the home screen opens Bluetooth pairing off AIR, the QR camera on AIR
[ambire_airgap]

# The QR camera on J_CAM (OV2640, OV5640 or GC2145): airgapped signing with the Ambire
# app over QR codes, and a camera test, behind the swipe up on the home screen on AIR
[ambire_camera]

# Hold the power key 3 s to switch off: the kernel drops PWR_HOLD
[ambire_power]

# The joystick (JOY_DIR's resistor ladder on PA2, the centre press on the power
# key): moves the home screen's grid and plays the games
[ambire_joystick]

# Bluetooth: Trezor's BLE stack on the nRF52840, over a 2-wire UART link
# (USART3, io/nrf/stm32u5/nrf_uart_link.c) instead of Trezor's SPI with
# handshake lines. No nRF firmware update from the STM32 and no nRF pairing
# authentication over it. Kept out of the bootloader (Delizia has no
# bootloader Bluetooth screens) and prodtest (its nRF tests need SPI and the
# handshake lines). [ambire_radio], the bring-up hello on the same UART, is for
# builds without [ble]: one owner of USART3.
[ble]
exclude_from = ["bootloader", "prodtest"]

[nrf]
link = "io/nrf_uart_link"
exclude_from = ["bootloader", "prodtest"]

[backlight]
driver = "io/backlight_pin"

# FT5426, identity coordinate mapping until checked on the panel.
[touch]
driver = "io/touch_ft6x36"
panel = "io/touch_panel_nhd240320af"

# NXP SE050 on I2C4: its random number generator is mixed into the strong RNG
# (seed generation, secret keys) beside the MCU's. Pins: ambire_p0.h (via ambire_v4.h).
[se050]
